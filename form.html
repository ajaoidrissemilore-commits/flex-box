<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="Name">Name</label>
        <input form="text" id="Name" placeholder=" Enter your Full name" required>
        <br><label for="Email">Email</label>
        <input type="email" id="email" placeholder=" Enter your Email address" required>
        <br><label for="Phone">Phone Number</label>
        <input type="number" id="Phone Number" placeholder="Enter your Phone Number" required>
        <br><label for="Date of Birth">Date of Birth</label>
        <input type="date" id="Date of Birth" required>
        <br><label for="Password">Password</label>
        <input type="password" id="Password" placeholder="Password" required>
        <br><label for="Time">Time</label>
        <input type="time" id="time" required>
        <br><label for="Telephone">Telephone</label>
        <input type="tel" id="Telephone" placeholder="Enter your Telephone Number" required>
        <br><label for="photo">Profile Picture</label>
        <input type="file" id="photo" placeholder="Insert an Image" required >
        <br><input type="radio" id="Male" name="Gender" value="Male" />
        <label for="Gender">Male</label>
        <input type="radio" id="Female" name="Gender" value="Female" />
        <label for="Female">Female</label>
        <input type="radio" id="Others" name="Gender" value="Others">
        <label for="Gender">Others</label>
        <br><input type="checkbox" id="Hobby" name="Hobby" value="Hobby">
        <label for="Hobby">Coding</label>
        <br><input type="checkbox" id="Hobby" name="Hobby" value="Hobby">
        <label for="Hobby">Gaming</label>
        <br><input type="checkbox" id="Hobby" name="Hobby" value="Hobby">
        <label for="Hobby">Cooking</label>
        <br><input type="checkbox" name="Hobby" id="Hobby" value="Hobby">
        <label for="Hobby">Reading</label>
        <br><input type="checkbox" name="Hobby" id="Hobby" value="Hobby">
        <label for="Hobby">Smoking</label>
        <br><br>
        <caption>Choose your state</caption>
        <label for="states">states</label>
        <select id="states" name="States">
            <option value="Abia">Abia</option>
            <option value="Adamawa">Adamawa</option>
        </select>
        <br>
        <br>
        <br>
            <br><label for="notes">Anything we should know</label>
            <textarea id="notes" name="notes" rows="12" cols="50" placeholder="Enter Message"></textarea>
            <br><br><button type="submit">Submit</button>
    </form>
</body>
</html>
